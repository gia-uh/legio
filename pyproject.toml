[project]
name = "legio"
version = "0.1.6"
description = "Queue-based agentic orchestration engine (domain-free library)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "GIA-UH — Grupo de Inteligencia Artificial, Universidad de La Habana" },
    { name = "Syalia S.R.L." },
]
keywords = ["agents", "orchestration", "workflow", "queue", "beaver", "polling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "beaver-db>=2.4,<3",
    "lingo-ai>=2.1,<3",
    "pydantic>=2",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "httpx",
    "typer",
]

[project.scripts]
legio = "legio.cli:main"

[project.urls]
Repository = "https://github.com/gia-uh/legio"
Changelog = "https://github.com/gia-uh/legio/blob/main/CHANGELOG.md"
Issues = "https://github.com/gia-uh/legio/issues"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "respx",
    "pyright",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
