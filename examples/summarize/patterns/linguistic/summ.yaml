name: summ
type: atomic
kind: linguistic
input:
  input_as: payload
  input_type: json
  input_schema:
    type: object
    properties:
      text:
        type: string
      lang:
        type: string
output:
  output_as: summ
  output_type: json
  output_schema:
    type: object
    properties:
      title:
        type: string
      summary:
        type: string
      word_count:
        type: integer
prompt: Summarize {text} and {lang}.
