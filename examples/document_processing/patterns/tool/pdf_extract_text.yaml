name: pdf_extract_text
type: atomic
kind: tool
main: false
description: "Extract text content from a PDF file using pypdf"
input:
  input_as: pdf_input
  input_type: json
  input_schema:
    type: object
    properties:
      file_path:
        type: string
        description: "Path to the PDF file to extract text from"
    required: [file_path]
    additionalProperties: false
output:
  output_as: pdf_output
  output_type: json
  output_schema:
    type: object
    properties:
      text:
        type: string
        description: "Full extracted text from the PDF"
      pages:
        type: integer
        description: "Number of pages in the PDF"
      metadata:
        type: object
        description: "PDF metadata (title, author, etc.)"
    required: [text, pages]
    additionalProperties: false
tool: pdf_extract_text
parameters:
  file_path: "{pdf_input.file_path}"
policy:
  timeout: 30.0