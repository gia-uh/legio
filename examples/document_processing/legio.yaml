node:
  id: "doc-processing@example"
database:
  db_path: "node.db"
patterns:
  tool: "patterns/tool"
  linguistic: "patterns/linguistic"
  composite: "patterns/composite"
tools:
  config: "tools.yaml"
lifecycle:
  default:
    drain_timeout: 30.0
    drain_interval: 0.05
services:
  llm:
    model: "mock"
    base_url: "http://localhost:11434/v1"
    api_key: "mock-key"
api:
  clients:
    demo:
      token: "demo-token"
      agents: ["doc_pipeline"]